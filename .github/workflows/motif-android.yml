name: Build MOTIF APK
on:
  push:
    branches: [motif-android-v0.1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p motif :app:assembleDebug
      - run: |
          mkdir -p dist
          cp motif/app/build/outputs/apk/debug/app-debug.apk dist/MOTIF-v0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/MOTIF-v0.1.0-debug.apk
          cd dist && sha256sum MOTIF-v0.1.0-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MOTIF-v0.1.0
          path: dist/
      - run: gradle --no-daemon -p motif :app:lintDebug
